name: Landing A11y & Lazy-Load Gate

# Fails the build whenever the landing page regresses on:
#   - missing image `alt` attributes
#   - missing `loading="lazy"` / `decoding="async"` on tile images
#   - axe-core image-alt violations
#
# Implemented as a fast vitest run (no headless browser needed) so CI
# stays under ~30s. See src/test/landing-a11y.test.tsx for the spec.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/components/landing/**'
      - 'src/pages/Index.tsx'
      - 'src/test/landing-a11y.test.tsx'
      - 'package.json'
      - 'bun.lockb'

jobs:
  a11y-gate:
    name: Landing image a11y + lazy-load gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run landing a11y / lazy-load gate
        run: bunx vitest run src/test/landing-a11y.test.tsx --reporter=verbose
